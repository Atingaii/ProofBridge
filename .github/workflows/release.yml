name: Bridge Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Test
        run: make test

      - name: Build release assets
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          make portable-package
          make bridge-downloads DOWNLOAD_DIR=dist VERSION="$VERSION"
          (cd dist && sha256sum codex-bridge-linux-amd64 > codex-bridge-linux-amd64.sha256)
          (cd dist && sha256sum codex-bridge-linux-arm64 > codex-bridge-linux-arm64.sha256)
          (cd dist && sha256sum codex-bridge-darwin-amd64 > codex-bridge-darwin-amd64.sha256)
          (cd dist && sha256sum codex-bridge-darwin-arm64 > codex-bridge-darwin-arm64.sha256)

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ProofBridge ${{ github.ref_name }}
          generate_release_notes: true
          make_latest: true
          files: |
            dist/codex-bridge-linux-amd64
            dist/codex-bridge-linux-amd64.sha256
            dist/codex-bridge-linux-arm64
            dist/codex-bridge-linux-arm64.sha256
            dist/codex-bridge-darwin-amd64
            dist/codex-bridge-darwin-amd64.sha256
            dist/codex-bridge-darwin-arm64
            dist/codex-bridge-darwin-arm64.sha256
            dist/codex-bridge-${{ github.ref_name }}-linux-amd64.tar.gz
            dist/codex-bridge-${{ github.ref_name }}-linux-amd64.tar.gz.sha256
