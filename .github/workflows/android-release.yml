name: Android signed release artifact (manual)

on:
  workflow_dispatch:

# Deliver a reviewable artifact; publishing a GitHub Release is a separate decision.
permissions:
  contents: read

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install minimal SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - name: Prepare private signing files
        env:
          SIGNING_KEY_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          python3 - <<'PY'
          import base64, os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP'])
          required = ['SIGNING_KEY_BASE64', 'SIGNING_STORE_PASSWORD', 'SIGNING_KEY_ALIAS', 'SIGNING_KEY_PASSWORD']
          if any(not os.environ.get(key) for key in required):
              raise SystemExit('Configure the four Android release signing secrets')
          key = root / 'android-release.jks'
          key.write_bytes(base64.b64decode(os.environ['SIGNING_KEY_BASE64'], validate=True))
          def escape(value):
              # Java Properties encoding; preserve Unicode and literal backslashes/newlines.
              return ''.join(''.join('\\u%04x' % int.from_bytes(c.encode('utf-16-be')[i:i+2], 'big') for i in range(0, len(c.encode('utf-16-be')), 2)) if ord(c) > 127 else
                             {'\\': '\\\\', '\n': '\\n', '\r': '\\r', '\t': '\\t', ' ': '\\ ', ':': '\\:', '=': '\\='}.get(c, c)
                             for c in value)
          values = {'storeFile': str(key), 'storePassword': os.environ['SIGNING_STORE_PASSWORD'],
                    'keyAlias': os.environ['SIGNING_KEY_ALIAS'], 'keyPassword': os.environ['SIGNING_KEY_PASSWORD']}
          props = root / 'android-signing.properties'
          props.write_text(''.join(k + '=' + escape(v) + '\n' for k, v in values.items()), encoding='ascii')
          with open(os.environ['GITHUB_ENV'], 'a') as environment:
              environment.write('ANDROID_SIGNING_PROPERTIES=' + str(props) + '\n')
          PY
      - name: Check and build signed release
        run: scripts/build-android-release.sh
      - name: Upload APK and checksum
        uses: actions/upload-artifact@v4
        with:
          name: CodexBridge-android-release
          path: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/apk/release/app-release.apk.sha256
          if-no-files-found: error
      - name: Remove temporary signing files
        if: always()
        shell: bash
        run: |
          rm -f -- "${RUNNER_TEMP}/android-release.jks" "${RUNNER_TEMP}/android-signing.properties"
