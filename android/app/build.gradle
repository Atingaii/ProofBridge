apply plugin: 'com.android.application'

// Signing properties live outside source control. Do not pass passwords on a command line.
def signingPath = System.getenv('ANDROID_SIGNING_PROPERTIES')
def releaseSigning = new Properties()
if (signingPath) {
    def signingFile = new File(signingPath)
    if (!signingFile.isFile()) throw new GradleException('Android signing properties file missing')
    signingFile.withInputStream { releaseSigning.load(it) }
    ['storeFile', 'storePassword', 'keyAlias', 'keyPassword'].each { key ->
        if (!releaseSigning.getProperty(key)) throw new GradleException('Incomplete Android signing properties')
    }
}

android {
    namespace = 'tech.sparkapi.codexbridge'
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId 'tech.sparkapi.codexbridge'
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 2
        versionName '1.1.0'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    buildFeatures { buildConfig true }
    buildToolsVersion '35.0.0'
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
    signingConfigs {
        if (signingPath) {
            release {
                storeFile new File(releaseSigning.getProperty('storeFile'))
                storePassword releaseSigning.getProperty('storePassword')
                keyAlias releaseSigning.getProperty('keyAlias')
                keyPassword releaseSigning.getProperty('keyPassword')
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (signingPath) signingConfig signingConfigs.release
        }
    }
    // The online host never packages Capacitor configuration or a second copy of the website.
    sourceSets.main.assets.srcDirs = []
}

dependencies {
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
}
