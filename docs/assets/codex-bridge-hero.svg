<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="800" viewBox="0 0 1600 800" role="img" aria-labelledby="title desc">
  <title id="title">Codex Bridge architecture banner</title>
  <desc id="desc">A browser connects to a public Hub and then through a reverse WebSocket to a private Bridge and two CLI sessions.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0a1018"/><stop offset=".55" stop-color="#0d1822"/><stop offset="1" stop-color="#101d25"/></linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#152531" stop-opacity=".96"/><stop offset="1" stop-color="#0e1821" stop-opacity=".96"/></linearGradient>
    <linearGradient id="cyanLine" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#55d6e8" stop-opacity=".18"/><stop offset=".45" stop-color="#55d6e8"/><stop offset="1" stop-color="#89eff0" stop-opacity=".28"/></linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="14"/></filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="20" stdDeviation="20" flood-color="#000" flood-opacity=".38"/></filter>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" fill="none" stroke="#8bb5c8" stroke-opacity=".07"/></pattern>
  </defs>
  <rect width="1600" height="800" fill="url(#bg)"/>
  <rect width="1600" height="800" fill="url(#grid)"/>
  <path d="M0 610C260 520 430 690 720 598S1130 470 1600 570" fill="none" stroke="#43b9c8" stroke-opacity=".08" stroke-width="2"/>
  <circle cx="1180" cy="300" r="190" fill="#23b9c5" opacity=".06" filter="url(#soft)"/>
  <circle cx="1370" cy="590" r="140" fill="#eca95b" opacity=".04" filter="url(#soft)"/>

  <g filter="url(#shadow)">
    <rect x="170" y="257" width="310" height="190" rx="14" fill="url(#panel)" stroke="#8acbd8" stroke-opacity=".28"/>
    <rect x="170" y="257" width="310" height="34" rx="14" fill="#1b303b"/>
    <circle cx="194" cy="274" r="5" fill="#f07e70"/><circle cx="212" cy="274" r="5" fill="#eab65a"/><circle cx="230" cy="274" r="5" fill="#5cc8a1"/>
    <path d="M202 334h176M202 358h224M202 382h156" stroke="#71d8df" stroke-opacity=".48" stroke-width="7" stroke-linecap="round"/>
    <rect x="202" y="404" width="102" height="14" rx="7" fill="#e4ab5e" fill-opacity=".72"/>
  </g>

  <g filter="url(#shadow)">
    <rect x="628" y="208" width="340" height="282" rx="18" fill="url(#panel)" stroke="#71dbe4" stroke-opacity=".46"/>
    <circle cx="798" cy="300" r="54" fill="#132f37" stroke="#69d9df" stroke-opacity=".6" stroke-width="2"/>
    <path d="M772 300h52M798 274v52" stroke="#6fe4e7" stroke-width="5" stroke-linecap="round"/>
    <path d="M678 386h240M678 414h190M678 442h150" stroke="#72d8df" stroke-opacity=".35" stroke-width="7" stroke-linecap="round"/>
    <circle cx="900" cy="244" r="7" fill="#5cc8a1"/><circle cx="922" cy="244" r="7" fill="#eab65a"/>
  </g>

  <g filter="url(#shadow)">
    <rect x="1110" y="186" width="292" height="214" rx="16" fill="url(#panel)" stroke="#e2aa5e" stroke-opacity=".4"/>
    <rect x="1110" y="186" width="292" height="34" rx="16" fill="#302a24"/>
    <path d="M1145 276l18 18 34-40M1145 342h188M1145 366h128" fill="none" stroke="#e2aa5e" stroke-opacity=".8" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <g filter="url(#shadow)">
    <rect x="1160" y="474" width="292" height="190" rx="16" fill="url(#panel)" stroke="#79d6dd" stroke-opacity=".34"/>
    <rect x="1160" y="474" width="292" height="34" rx="16" fill="#1b3038"/>
    <path d="M1196 552h18l-12 12 12 12M1238 576h112M1196 616h178" fill="none" stroke="#75d9df" stroke-opacity=".72" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <path d="M480 352C545 352 565 336 628 336" fill="none" stroke="url(#cyanLine)" stroke-width="5" stroke-linecap="round"/>
  <path d="M968 336C1020 336 1055 292 1110 292" fill="none" stroke="url(#cyanLine)" stroke-width="5" stroke-linecap="round"/>
  <path d="M968 382C1050 430 1080 540 1160 548" fill="none" stroke="#e2aa5e" stroke-opacity=".52" stroke-width="3" stroke-dasharray="8 12"/>
  <circle cx="550" cy="352" r="7" fill="#72e1e5"/><circle cx="1050" cy="315" r="7" fill="#72e1e5"/><circle cx="1092" cy="518" r="6" fill="#e2aa5e"/>

  <g fill="#a4c3ce" fill-opacity=".5"><circle cx="90" cy="100" r="2"/><circle cx="540" cy="120" r="2"/><circle cx="1010" cy="100" r="2"/><circle cx="1510" cy="120" r="2"/><circle cx="90" cy="710" r="2"/><circle cx="520" cy="720" r="2"/><circle cx="1040" cy="730" r="2"/><circle cx="1510" cy="700" r="2"/></g>
</svg>
